# ERPNext sandbox for the carbonTraceAI demo.
#
# Boots a complete frappe/erpnext v15 stack with one command:
#
#   docker compose -f docker-compose.erpnext.yml up -d
#
# Wait ~3-5 minutes the *first* time (image init + new-site bootstrap).
# Then visit http://localhost:8080 — login Administrator / admin.
#
# Once it's up, seed it with a realistic Mozal Aluminium or OCP Fertiliser
# dataset:
#
#   python -m scripts.seed_erpnext --profile mozal_aluminium
#   python -m scripts.seed_erpnext --profile ocp_fertiliser
#
# Then run the full ingestion pipeline against it:
#
#   python -m scripts.run_erpnext_pipeline
#
# For a remote pitch (cloud Airbyte talking to your laptop), tunnel 8080:
#
#   ngrok http 8080
#
# and use the resulting https URL as the ERPNext base_url in the connector.
#
# This file is a self-contained adaptation of frappe_docker/pwd.yml.

x-frappe-image: &frappe_image
  image: frappe/erpnext:v15.74.4
  pull_policy: missing

x-frappe-volumes: &frappe_volumes
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  backend:
    <<: [*frappe_image, *frappe_volumes]

  configurator:
    <<: [*frappe_image, *frappe_volumes]
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: [*frappe_image, *frappe_volumes]
    deploy:
      restart_policy:
        condition: none
    depends_on:
      configurator:
        condition: service_completed_successfully
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ ! -d "sites/frontend" ]; then
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password=admin \
            --db-root-username=root \
            --db-root-password=admin \
            --install-app erpnext \
            --set-default frontend;
        else
          echo "Site already exists — skipping new-site.";
        fi

  db:
    image: mariadb:10.6
    healthcheck:
      test: mysqladmin ping -h localhost --password=admin
      interval: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: admin
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    <<: [*frappe_image, *frappe_volumes]
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    command:
      - nginx-entrypoint.sh
    ports:
      - "8080:8080"

  queue-long:
    <<: [*frappe_image, *frappe_volumes]
    command: bench worker --queue long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    <<: [*frappe_image, *frappe_volumes]
    command: bench worker --queue short,default
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine

  scheduler:
    <<: [*frappe_image, *frappe_volumes]
    command: bench schedule
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    <<: [*frappe_image, *frappe_volumes]
    command: node /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
